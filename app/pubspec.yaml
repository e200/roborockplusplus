name: aspira
description: "Roborock++: a better app for the Roborock Saros 20."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2
  http: ^1.6.0
  mqtt_client: ^10.13.0
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  typed_data: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#4F5BD5"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
